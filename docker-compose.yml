services:
  neo4j:
    image: neo4j:5.20-community
    container_name: medgraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: medgraph-agent
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=sarvam
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_MODEL=sarvam-105b
      - SARVAM_BASE_URL=https://api.sarvam.ai/v2
      - USE_MOCK_API=false
      - API_BASE_URL=http://backend:5000
    depends_on:
      - neo4j

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medgraph-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - LLM_PROVIDER=sarvam
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_MODEL=sarvam-105b
      - SARVAM_STT_MODEL=saaras:v4
      - SARVAM_TTS_MODEL=bulbul:v4-flash
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - USE_IN_MEMORY_FALLBACK=true
      - AGENT_SERVICE_URL=http://agent:8000/investigate
    depends_on:
      - neo4j
      - agent

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medgraph-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
