services:
  # 1. FastAPI LangGraph Agent Service
  - type: web
    name: medgraph-agent
    runtime: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai/v2
      - key: USE_MOCK_API
        value: "false"

  # 2. Node.js Express Backend Service
  - type: web
    name: medgraph-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SARVAM_STT_MODEL
        value: saaras:v4
      - key: SARVAM_TTS_MODEL
        value: bulbul:v4-flash
      - key: USE_IN_MEMORY_FALLBACK
        value: "true"
      - key: AGENT_SERVICE_URL
        fromService:
          type: web
          name: medgraph-agent
          property: host
          value: "http://${host}/investigate"

  # 3. Static React Frontend
  - type: web
    name: medgraph-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medgraph-backend
          property: host
          value: "https://${host}"
